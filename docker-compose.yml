version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./sentinelai.db
      - SECRET_KEY=sentinel_ai_super_secret_jwt_key_enterprise_2026_banking_system
      - MOCK_OTP_MODE=true
    volumes:
      - ./data:/app/data
      - ./backend/app/ml/artifacts:/app/backend/app/ml/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
